name: dighri_customer
description: تطبيق الزبون لمشروع دغري
publish_to: 'none' # خاص للتطوير المحلي

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # إدارة الحالة
  flutter_bloc: ^8.1.3

  # التخزين المحلي
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # أدوات المطور
  logger: ^2.4.0

  # HTTP Client
  dio: ^5.3.2

  # الملاحة
  go_router: ^12.0.0

  # تحديد الموقع (الإضافات المطلوبة)
  geolocator: ^11.0.0
  geocoding: ^2.2.0

  # الواجهات
  flutter_svg: ^2.0.7
  lottie: ^2.7.0
  
  # الأدوات المساعدة
  intl: ^0.18.1
  equatable: ^2.0.5
  url_launcher: ^6.2.4
  image_picker: ^1.2.1
  mobile_scanner: ^5.1.1
  
  # الإشعارات و Firebase
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0A1628"
  image: "assets/images/app_icon.png"
  color_dark: "#0A1628"
  image_dark: "assets/images/app_icon.png"
  android_12:
    color: "#0A1628"
    image: "assets/images/app_icon.png"
    color_dark: "#0A1628"
    image_dark: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900