<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <g transform="translate(80, 40)">
    <!-- Dot of the 'j' (Pill/Capsule) -->
    <g transform="translate(188, 55) rotate(35)">
      <!-- Top Half (Blue) -->
      <path d="M -28 -28 A 28 28 0 0 1 28 -28 L 28 -2 L -28 -2 Z" fill="#1E3A8A"/>
      <!-- Bottom Half (Green) -->
      <path d="M -28 2 L 28 2 L 28 28 A 28 28 0 0 1 -28 28 Z" fill="#10B981"/>
    </g>

    <!-- Stem of the 'j' + Snake Curve -->
    <path d="M 155 150
             A 32 32 0 0 1 215 150
             V 290
             A 92 92 0 0 1 31 290
             A 32 32 0 0 1 95 290
             A 28 28 0 0 0 155 290
             Z" 
          fill="url(#stemGrad)" />
          
    <!-- Snake Eye -->
    <circle cx="63" cy="277" r="5.5" fill="#ffffff" />
    
    <!-- Snake Tongue -->
    <path d="M 63 258 L 63 238 M 63 238 L 54 228 M 63 238 L 72 228" 
          stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
